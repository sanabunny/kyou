id: page.fuwa.kyou
runtime: io.elementary.Platform
runtime-version: "9"
sdk: io.elementary.Sdk
command: kyou
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --talk-name=org.gnome.evolution.dataserver.*
cleanup:
  - /include
  - /lib/pkgconfig
  - /man
  - /share/doc
  - /share/gtk-doc
  - /share/man
  - /share/pkgconfig
  - "*.la"
  - "*.a"
modules:
  - name: blueprint-compiler
    buildsystem: meson
    sources:
      - type: git
        url: https://gitlab.gnome.org/GNOME/blueprint-compiler.git
        tag: v0.22.2

  - name: kyou
    builddir: true
    buildsystem: meson
    config-opts:
      - --libdir=lib
    sources:
      - type: dir
        path: ../
