id: page.fuwa.kyou
runtime: io.elementary.Platform
runtime-version: "9"
sdk: io.elementary.Sdk
command: kyou
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --talk-name=org.gnome.evolution.dataserver.*
cleanup:
  - /include
  - /lib/pkgconfig
  - /man
  - /share/doc
  - /share/gtk-doc
  - /share/man
  - /share/pkgconfig
  - "*.la"
  - "*.a"
modules:
  - name: blueprint-compiler
    buildsystem: meson
    sources:
      - type: git
        url: https://gitlab.gnome.org/GNOME/blueprint-compiler.git
        tag: v0.22.2

  - name: libical
    buildsystem: cmake-ninja
    cleanup:
      - /lib/cmake
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DCMAKE_INSTALL_LIBDIR=/app/lib
      - -DBUILD_SHARED_LIBS=ON
      - -DICAL_GLIB=true
      - -DICAL_GLIB_VAPI=true
      - -DGOBJECT_INTROSPECTION=true
      - -DICAL_BUILD_DOCS=false
      - -DWITH_CXX_BINDINGS=false
      - -DSHARED_ONLY=true
      - -DLIBICAL_BUILD_TESTING=false
    sources:
      - type: git
        url: https://github.com/libical/libical.git
        tag: v3.0.9

  - name: evolution-data-server
    buildsystem: cmake-ninja
    cleanup:
      - /lib/evolution-data-server/*-backends
      - /libexec
      - /share/dbus-1/services
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DENABLE_GTK=ON
      - -DENABLE_CANBERRA=OFF
      - -DENABLE_GOA=OFF
      - -DENABLE_GOOGLE=ON
      - -DENABLE_VALA_BINDINGS=ON
      - -DENABLE_INTROSPECTION=ON
      - -DENABLE_GOA=OFF
      - -DENABLE_CANBERRA=OFF
      - -DWITH_LIBDB=OFF
      - -DENABLE_WEATHER=OFF
      - -DWITH_OPENLDAP=OFF
      - -DENABLE_INSTALLED_TESTS=OFF
      - -DENABLE_TESTS=OFF
      - -DENABLE_GTK_DOC=OFF
      - -DENABLE_EXAMPLES=OFF
    sources:
      - type: archive
        url: https://download.gnome.org/sources/evolution-data-server/3.61/evolution-data-server-3.61.3.tar.xz
        sha256: 1cb9c9b6a12fa53473f5c0332ac39fff32586fb22a932a26aa973c260bb13a83
        x-checker-data:
          type: gnome
          name: evolution-data-server
    modules:
      - name: intltool
        cleanup:
          - '*'
        sources:
          - type: archive
            url: https://launchpad.net/intltool/trunk/0.51.0/+download/intltool-0.51.0.tar.gz
            md5: 12e517cac2b57a0121cda351570f1e63

  - name: kyou
    builddir: true
    buildsystem: meson
    config-opts:
      - --libdir=lib
    sources:
      - type: dir
        path: ../
